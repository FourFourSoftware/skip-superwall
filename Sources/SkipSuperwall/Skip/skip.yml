# Configuration file for https://skip.tools project
#
# Kotlin dependencies and Gradle build options for this module are configured
# here. Mirrors the skip-crisp / skip-revenue / skip-firebase approach: the
# transpiled Kotlin sources reference `com.superwall.sdk.*`, which is provided
# by the Superwall Android SDK Maven artifact declared below.

skip:
  mode: 'transpiled'
  bridging: true

build:
  contents:
    # Superwall Android SDK (Maven Central). Versions independently from the
    # iOS SDK (SuperwallKit tracks the 4.x line; Android tracks 2.x).
    - block: 'dependencies'
      contents:
        - 'implementation("com.superwall.sdk:superwall-android:2.7.20")'
        # The PurchaseController interface exposes billingclient's ProductDetails,
        # but superwall-android declares billing as `implementation` (runtime-only
        # for consumers), so the type must be added to our compile classpath
        # explicitly. compileOnly: the runtime copy still arrives transitively
        # from superwall-android, avoiding a second pinned version. 8.0.0 is the
        # version superwall-android 2.7.20 ships against.
        - 'compileOnly("com.android.billingclient:billing:8.0.0")'
